# Keeps the Action's major tag (v1) on the latest release, so
# `uses: mahAnuj/prompteval@v1` always gets the newest v1.x.y.
#
# Runs after every release (a v*.*.* tag) and when this file changes on main.
# Moving a tag with GITHUB_TOKEN starts no other workflow, and v1 does not
# match the release trigger (v*.*.*), so this cannot publish anything.
name: Move major tag

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths: [".github/workflows/major-tag.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point v1 at the latest v1.x.y-compatible release
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then echo "No release tags yet."; exit 0; fi
          echo "Latest release: $latest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a v1 -m "prompteval v1 (currently $latest)" "$latest^{commit}"
          git push -f origin refs/tags/v1
